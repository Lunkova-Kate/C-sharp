    <text x="70" y="242" class="field">code : varchar(32)</text><text x="343.75" y="244" class="plus">+</text><text x="391.25" y="244" class="plus">+</text>
    <text x="70" y="278" class="field">name : varchar(100)</text><text x="391.25" y="280" class="plus">+</text><text x="438.75" y="280" class="plus">+</text>
    <text x="70" y="314" class="field">lesson_order : smallint</text><text x="391.25" y="316" class="plus">+</text><text x="438.75" y="316" class="plus">+</text>
  </g>

