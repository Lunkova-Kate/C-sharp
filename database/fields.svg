<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1100" viewBox="0 0 3000 1100" role="img" aria-labelledby="title desc">
  <title id="title">Поля и ограничения таблиц Master of Skipping</title>
  <desc id="desc">Восемь таблиц с колонками Поле, PK, NN, U и FK. Внешние ключи соединены линиями с целевыми таблицами.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#444"/></marker>
    <style>
      .title{font:700 34px Inter,"Segoe UI",Arial,sans-serif;fill:#111}.box{fill:#fff;stroke:#333;stroke-width:1.5}.head-student,.head-professor,.head-history,.head-reference{fill:#eee}
      .tname{font:700 18px Inter,"Segoe UI",Arial,sans-serif;fill:#172033}.sql{font:600 12px "Cascadia Mono",Consolas,monospace;fill:#667085}
      .ch{font:700 13px Inter,"Segoe UI",Arial,sans-serif;fill:#333;text-anchor:middle}.field{font:400 14px "Cascadia Mono",Consolas,monospace;fill:#111}.plus{font:800 18px Inter,"Segoe UI",Arial,sans-serif;fill:#111;text-anchor:middle}
      .grid{stroke:#bbb;stroke-width:1}.pk-note{font:600 12px Inter,"Segoe UI",Arial,sans-serif;fill:#333}.fk{fill:none;stroke:#444;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .fk-label{font:600 12px "Cascadia Mono",Consolas,monospace;fill:#222;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="3000" height="1100" fill="#fff"/>
  <text x="50" y="54" class="title">Поля и ограничения таблиц</text>

  <!-- FK connectors -->
  <g id="foreign-keys">
    <path class="fk" d="M800 236 C690 236 650 450 510 450"/>
    <path class="fk" d="M800 272 C690 272 650 180 510 180"/>
    <path class="fk" d="M800 308 C665 308 650 820 510 820"/>
    <path class="fk" d="M800 344 C675 344 640 205 510 205"/>
    <path class="fk" d="M800 380 C665 380 630 230 510 230"/>
    <path class="fk" d="M800 726 C680 726 650 520 510 520"/>
    <path class="fk" d="M1570 596 C1450 596 1400 710 1260 710"/><text x="1300" y="660" class="fk-label">(semester_id, day_number)</text>
    <path class="fk" d="M1570 660 C1440 660 1410 330 1260 330"/><text x="1300" y="480" class="fk-label">(semester_id, subject_code)</text>
    <path class="fk" d="M2440 300 C2260 300 2200 575 2030 575"/><text x="2160" y="425" class="fk-label">PK → lesson</text>
    <path class="fk" d="M2440 830 C2260 830 2200 650 2030 650"/><text x="2160" y="760" class="fk-label">PK → lesson</text>
  </g>

  <!-- SUBJECT: x=50 y=130 w=460 h=196 -->
  <g id="subject-table">
