    <text x="70" y="161" class="tname">ПРЕДМЕТ</text><text x="490" y="160" text-anchor="end" class="sql">subject</text>
    <line x1="50" y1="180" x2="510" y2="180" class="grid"/><line x1="50" y1="218" x2="510" y2="218" class="grid"/><line x1="50" y1="254" x2="510" y2="254" class="grid"/><line x1="50" y1="290" x2="510" y2="290" class="grid"/>
    <line x1="320" y1="180" x2="320" y2="326" class="grid"/><line x1="367.5" y1="180" x2="367.5" y2="326" class="grid"/><line x1="415" y1="180" x2="415" y2="326" class="grid"/><line x1="462.5" y1="180" x2="462.5" y2="326" class="grid"/>
