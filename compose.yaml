services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: master_of_skipping
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
        test:
          - CMD-SHELL
          - pg_isready -U postgres -d master_of_skipping
        interval: 5s
        timeout: 5s
        retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

  history:
    build:
      context: .
      dockerfile: MasterOfSkipping.HistoryService/Dockerfile
    image: master-of-skipping-history
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__HistoryDatabase: "Host=postgres;Port=5432;Database=master_of_skipping;Username=postgres;Password=postgres"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "guest"
      RabbitMq__Password: "guest"
      RabbitMq__QueueName: "lesson-results"
    ports:
      - "5106:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  professor-calculus:
    build:
      context: .
      dockerfile: MasterOfSkipping.ProfessorService/Dockerfile
    image: master-of-skipping-professor
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      HistoryService__BaseUrl: "http://history:8080"
      Professor__SubjectCode: "CALCULUS"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "guest"
      RabbitMq__Password: "guest"
      RabbitMq__QueueName: "lesson-results"
    ports:
      - "5201:8080"
    depends_on:
      history:
        condition: service_started
      rabbitmq:
        condition: service_healthy

